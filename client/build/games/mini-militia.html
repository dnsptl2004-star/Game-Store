<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mini Militia - Doodle Army 2 Online</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0b0f19;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 1000px;
      max-height: 600px;
      border: 2px solid #00f0ff;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
      overflow: hidden;
      background: #111827;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #1f2937 0%, #111827 80%, #064e3b 100%);
    }
    #hud {
      position: absolute;
      top: 12px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .hud-box {
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.4);
      padding: 6px 14px;
      border-radius: 8px;
      display: flex;
      gap: 12px;
      align-items: center;
      font-weight: 700;
      font-size: 0.9rem;
    }
    .bar-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .meter {
      width: 100px;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .meter-fill {
      height: 100%;
      transition: width 0.1s linear;
    }
    #health-fill { background: #ef4444; width: 100%; }
    #nitro-fill { background: #00f0ff; width: 100%; }
    #controls-hint {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.78rem;
      color: #94a3b8;
      pointer-events: none;
    }
    #controls-hint b { color: #00f0ff; }
    #game-over-screen {
      position: absolute;
      inset: 0;
      background: rgba(11, 15, 25, 0.9);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
    }
    #game-over-screen h2 { font-size: 2.2rem; color: #ef4444; text-shadow: 0 0 20px rgba(239, 68, 68, 0.6); }
    .respawn-btn {
      background: linear-gradient(135deg, #00f0ff, #3b82f6);
      border: none;
      color: #0b0f19;
      font-weight: 900;
      font-size: 1rem;
      padding: 12px 28px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 240, 255, 0.4);
      transition: transform 0.15s;
    }
    .respawn-btn:hover { transform: scale(1.05); }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="canvas" width="1000" height="600"></canvas>
    
    <div id="hud">
      <div class="hud-box">
        <div class="bar-wrap">
          <span>❤️ HP:</span>
          <div class="meter"><div id="health-fill" class="meter-fill"></div></div>
        </div>
        <div class="bar-wrap">
          <span>⚡ JET:</span>
          <div class="meter"><div id="nitro-fill" class="meter-fill"></div></div>
        </div>
      </div>
      <div class="hud-box">
        <span>🔫 Kills: <b id="kills-count" style="color: #10b981;">0</b></span>
        <span>💣 Grenades: <b id="grenades-count" style="color: #fbbf24;">3</b></span>
      </div>
    </div>

    <div id="controls-hint">
      <b>[A/D or ◄/►]</b> Move • <b>[W / ▲ / Space]</b> Jetpack Fly • <b>[Mouse / Touch]</b> Aim & Shoot • <b>[G]</b> Grenade
    </div>

    <div id="game-over-screen">
      <h2>💀 YOU WERE ELIMINATED</h2>
      <p id="final-stats" style="font-size: 1.1rem; color: #cbd5e1;">Final Kills: 0</p>
      <button class="respawn-btn" onclick="respawnPlayer()">⚡ RESPAWN & PLAY AGAIN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const healthFill = document.getElementById('health-fill');
    const nitroFill = document.getElementById('nitro-fill');
    const killsEl = document.getElementById('kills-count');
    const grenadesEl = document.getElementById('grenades-count');
    const gameOverScreen = document.getElementById('game-over-screen');
    const finalStats = document.getElementById('final-stats');

    // Audio context for sound effects
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playBeep(freq, type, duration) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // Input state
    const keys = {};
    const mouse = { x: 500, y: 300, down: false };

    window.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
      if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'ArrowDown') e.preventDefault();
      if (e.key.toLowerCase() === 'g') throwGrenade(player);
    });
    window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = (e.clientX - rect.left) * (canvas.width / rect.width);
      mouse.y = (e.clientY - rect.top) * (canvas.height / rect.height);
    });
    canvas.addEventListener('mousedown', () => { mouse.down = true; });
    window.addEventListener('mouseup', () => { mouse.down = false; });

    // Touch support for mobile
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      mouse.x = (touch.clientX - rect.left) * (canvas.width / rect.width);
      mouse.y = (touch.clientY - rect.top) * (canvas.height / rect.height);
      mouse.down = true;
    }, { passive: false });
    canvas.addEventListener('touchstart', (e) => {
      mouse.down = true;
      keys['w'] = true;
    });
    canvas.addEventListener('touchend', () => {
      mouse.down = false;
      keys['w'] = false;
    });

    // Platforms
    const platforms = [
      { x: 0, y: 550, w: 1000, h: 50 },
      { x: 100, y: 420, w: 220, h: 18 },
      { x: 680, y: 420, w: 220, h: 18 },
      { x: 380, y: 320, w: 240, h: 18 },
      { x: 150, y: 220, w: 200, h: 18 },
      { x: 650, y: 220, w: 200, h: 18 },
    ];

    // Player
    const player = {
      x: 200,
      y: 400,
      vx: 0,
      vy: 0,
      r: 18,
      hp: 100,
      maxHp: 100,
      nitro: 100,
      maxNitro: 100,
      kills: 0,
      grenades: 3,
      color: '#00f0ff',
      isDead: false,
      shootCooldown: 0
    };

    // Bullets, Grenades, Bots, Particles
    let bullets = [];
    let grenades = [];
    let particles = [];
    let bots = [];

    function spawnBot() {
      const spawns = [
        { x: 150, y: 360 },
        { x: 800, y: 360 },
        { x: 500, y: 260 },
        { x: 200, y: 160 },
        { x: 750, y: 160 }
      ];
      const spot = spawns[Math.floor(Math.random() * spawns.length)];
      bots.push({
        x: spot.x,
        y: spot.y,
        vx: 0,
        vy: 0,
        r: 18,
        hp: 60,
        maxHp: 60,
        nitro: 100,
        color: '#ef4444',
        shootCooldown: Math.random() * 40 + 20,
        jumpTimer: Math.random() * 60 + 30,
        dir: Math.random() > 0.5 ? 1 : -1
      });
    }

    // Initial bots
    for (let i = 0; i < 4; i++) spawnBot();

    function shootBullet(shooter, targetX, targetY) {
      const angle = Math.atan2(targetY - shooter.y, targetX - shooter.x);
      const speed = 14;
      bullets.push({
        x: shooter.x + Math.cos(angle) * (shooter.r + 5),
        y: shooter.y + Math.sin(angle) * (shooter.r + 5),
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        shooter: shooter,
        color: shooter === player ? '#00f0ff' : '#ef4444',
        life: 70
      });
      playBeep(shooter === player ? 600 : 350, 'sawtooth', 0.06);
    }

    function throwGrenade(thrower) {
      if (thrower === player && player.grenades <= 0) return;
      if (thrower === player) {
        player.grenades--;
        grenadesEl.innerText = player.grenades;
      }
      const angle = Math.atan2(mouse.y - thrower.y, mouse.x - thrower.x);
      const speed = 11;
      grenades.push({
        x: thrower.x,
        y: thrower.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2,
        r: 8,
        fuse: 80,
        color: '#fbbf24'
      });
      playBeep(250, 'triangle', 0.1);
    }

    function createExplosion(x, y, radius, damage) {
      playBeep(120, 'square', 0.3);
      for (let i = 0; i < 25; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = Math.random() * 6 + 2;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          size: Math.random() * 6 + 3,
          color: ['#fbbf24', '#f97316', '#ef4444', '#fff'][Math.floor(Math.random() * 4)],
          life: 30
        });
      }

      // Damage check
      [player, ...bots].forEach((entity) => {
        const dist = Math.hypot(entity.x - x, entity.y - y);
        if (dist < radius) {
          entity.hp -= Math.floor(damage * (1 - dist / radius));
        }
      });
    }

    function updatePhysics(obj) {
      // Gravity
      obj.vy += 0.45;
      obj.x += obj.vx;
      obj.y += obj.vy;
      obj.vx *= 0.88;

      // Platform collisions
      platforms.forEach((p) => {
        if (
          obj.x + obj.r > p.x &&
          obj.x - obj.r < p.x + p.w &&
          obj.y + obj.r >= p.y &&
          obj.y - obj.r <= p.y + p.h &&
          obj.vy > 0
        ) {
          obj.y = p.y - obj.r;
          obj.vy = 0;
        }
      });

      // Boundaries
      if (obj.x - obj.r < 0) { obj.x = obj.r; obj.vx = 0; }
      if (obj.x + obj.r > canvas.width) { obj.x = canvas.width - obj.r; obj.vx = 0; }
      if (obj.y - obj.r < 0) { obj.y = obj.r; obj.vy = 0; }
    }

    function update() {
      if (!player.isDead) {
        // Player Controls
        if (keys['a'] || keys['arrowleft']) player.vx -= 0.9;
        if (keys['d'] || keys['arrowright']) player.vx += 0.9;

        // Jetpack
        if ((keys['w'] || keys['arrowup'] || keys[' ']) && player.nitro > 0) {
          player.vy -= 0.85;
          player.nitro -= 0.8;
          // Jetpack thruster smoke
          particles.push({
            x: player.x + (Math.random() * 8 - 4),
            y: player.y + player.r,
            vx: Math.random() * 2 - 1,
            vy: Math.random() * 3 + 2,
            size: Math.random() * 4 + 2,
            color: '#00f0ff',
            life: 18
          });
        } else if (player.nitro < player.maxNitro) {
          player.nitro += 0.3;
        }

        // Shooting
        if (player.shootCooldown > 0) player.shootCooldown--;
        if (mouse.down && player.shootCooldown === 0) {
          shootBullet(player, mouse.x, mouse.y);
          player.shootCooldown = 9;
        }

        updatePhysics(player);

        // Health check
        if (player.hp <= 0) {
          player.isDead = true;
          player.hp = 0;
          finalStats.innerText = `Final Kills: ${player.kills} 🎯`;
          gameOverScreen.style.display = 'flex';
          createExplosion(player.x, player.y, 60, 0);
        }

        healthFill.style.width = `${Math.max(0, (player.hp / player.maxHp) * 100)}%`;
        nitroFill.style.width = `${Math.max(0, (player.nitro / player.maxNitro) * 100)}%`;
      }

      // Update Bots
      bots.forEach((bot, bIdx) => {
        // Simple AI
        bot.shootCooldown--;
        bot.jumpTimer--;

        // Patrol & Track
        const distToPlayer = Math.hypot(player.x - bot.x, player.y - bot.y);
        if (distToPlayer < 450 && !player.isDead) {
          bot.vx += player.x > bot.x ? 0.4 : -0.4;
          if (bot.shootCooldown <= 0) {
            shootBullet(bot, player.x + (Math.random() * 20 - 10), player.y + (Math.random() * 20 - 10));
            bot.shootCooldown = Math.random() * 40 + 25;
          }
          if (player.y < bot.y - 40 && bot.jumpTimer <= 0) {
            bot.vy -= 8;
            bot.jumpTimer = 50;
          }
        } else {
          bot.vx += bot.dir * 0.3;
          if (Math.random() < 0.02) bot.dir *= -1;
        }

        updatePhysics(bot);

        // Bot death
        if (bot.hp <= 0) {
          createExplosion(bot.x, bot.y, 50, 0);
          bots.splice(bIdx, 1);
          player.kills++;
          killsEl.innerText = player.kills;
          setTimeout(spawnBot, 2500);
        }
      });

      // Update Bullets
      bullets.forEach((b, idx) => {
        b.x += b.vx;
        b.y += b.vy;
        b.life--;

        // Hit bots
        if (b.shooter === player) {
          bots.forEach((bot) => {
            if (Math.hypot(b.x - bot.x, b.y - bot.y) < bot.r + 4) {
              bot.hp -= 22;
              b.life = 0;
            }
          });
        } else if (b.shooter !== player && !player.isDead) {
          if (Math.hypot(b.x - player.x, b.y - player.y) < player.r + 4) {
            player.hp -= 15;
            b.life = 0;
          }
        }

        // Platform hits
        platforms.forEach((p) => {
          if (b.x > p.x && b.x < p.x + p.w && b.y > p.y && b.y < p.y + p.h) {
            b.life = 0;
          }
        });

        if (b.life <= 0) bullets.splice(idx, 1);
      });

      // Update Grenades
      grenades.forEach((g, idx) => {
        g.vy += 0.35;
        g.x += g.vx;
        g.y += g.vy;
        g.vx *= 0.98;
        g.fuse--;

        platforms.forEach((p) => {
          if (g.x > p.x && g.x < p.x + p.w && g.y + g.r >= p.y && g.y - g.r <= p.y + p.h) {
            g.y = p.y - g.r;
            g.vy *= -0.5;
            g.vx *= 0.7;
          }
        });

        if (g.fuse <= 0) {
          createExplosion(g.x, g.y, 90, 85);
          grenades.splice(idx, 1);
        }
      });

      // Update Particles
      particles.forEach((pt, idx) => {
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life--;
        if (pt.life <= 0) particles.splice(idx, 1);
      });
    }

    function drawEntity(e, isPlayer = false) {
      ctx.save();
      ctx.translate(e.x, e.y);

      // Jetpack Thruster
      ctx.fillStyle = '#475569';
      ctx.fillRect(-e.r - 4, -4, 8, 14);

      // Body (Circle Doodle Soldier)
      ctx.beginPath();
      ctx.arc(0, 0, e.r, 0, Math.PI * 2);
      ctx.fillStyle = e.color;
      ctx.shadowColor = e.color;
      ctx.shadowBlur = isPlayer ? 15 : 6;
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = '#fff';
      ctx.stroke();

      // Bandana
      ctx.fillStyle = isPlayer ? '#00f0ff' : '#000';
      ctx.fillRect(-e.r + 2, -10, e.r * 2 - 4, 6);

      // Gun
      const aimTarget = isPlayer ? mouse : player;
      const angle = Math.atan2(aimTarget.y - e.y, aimTarget.x - e.x);
      ctx.rotate(angle);
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(8, -3, 16, 6);
      ctx.fillStyle = '#94a3b8';
      ctx.fillRect(16, -2, 6, 4);

      ctx.restore();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Platforms
      platforms.forEach((p) => {
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.strokeStyle = '#00f0ff';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(p.x, p.y, p.w, p.h);
        // Grass top
        ctx.fillStyle = '#10b981';
        ctx.fillRect(p.x, p.y, p.w, 4);
      });

      // Bullets
      bullets.forEach((b) => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 8;
        ctx.fill();
      });

      // Grenades
      grenades.forEach((g) => {
        ctx.beginPath();
        ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
        ctx.fillStyle = g.color;
        ctx.shadowColor = '#f59e0b';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.stroke();
      });

      // Particles
      particles.forEach((pt) => {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
        ctx.fillStyle = pt.color;
        ctx.fill();
      });

      // Draw Bots
      bots.forEach((bot) => drawEntity(bot, false));

      // Draw Player
      if (!player.isDead) drawEntity(player, true);
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    function respawnPlayer() {
      player.x = 200;
      player.y = 400;
      player.vx = 0;
      player.vy = 0;
      player.hp = player.maxHp;
      player.nitro = player.maxNitro;
      player.grenades = 3;
      player.isDead = false;
      grenadesEl.innerText = 3;
      gameOverScreen.style.display = 'none';
    }

    loop();
  </script>
</body>
</html>
