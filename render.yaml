services:
  - type: web
    name: gamevault-store
    env: node
    plan: free
    buildCommand: npm install && npm install --prefix client && npm run build --prefix client
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STORJ_S3_ENDPOINT
        value: https://gateway.storjshare.io
      - key: STORJ_ACCESS_KEY_ID
        value: jwo5dkhjwh66u75bouapm4yntqyq
      - key: STORJ_SECRET_ACCESS_KEY
        value: j277wm3vllcv57x3kcu4qfm7nnzkszjhlvshpe5hnbqwjwaf3i2qu
      - key: PUBLIC_BASE_URL
        value: https://link.storjshare.io/raw
